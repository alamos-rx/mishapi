[package]
name = "mishapi"
version = "0.1.0"
edition = "2024"
description = "Cliente de APIs REST agentic first: lo usan igual de bien una persona y un agente de IA."
license-file = "LICENSE"
authors = ["gatio-labs"]
repository = "https://github.com/alamos-rx/mishapi"

[dependencies]
eframe = "0.31"
boa_engine = "0.20"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
rfd = "0.15"
serde_yaml = "0.9"
# Ya viene con rustls; se usa para PKCE (SHA-256) y valores aleatorios seguros de OAuth 2.0.
ring = "0.17"

# La app no tiene tests propios (están en la lib) y Windows bloquea su ejecutable de test con subsistema GUI.
[[bin]]
name = "mishapi"
path = "src/main.rs"
test = false

# Binarios de release más chicos y rápidos (más lento de compilar).
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
